<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大明副站 MgDyqwq | MingDynasty</title>
  
    <link rel="icon" href="https://MingDynasty1.github.io/000000000000000000.png" type="image/png">
    <script>
        // 明暗模式初始化（优先读取本地存储）
        if(localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)){
            document.documentElement.classList.add('dark')
        }
    </script>
    <style>
        /* 全局变量 明暗两套主题 */
        :root{
            --bg: #f8f3e8;
            --text: #2c1810;
            --primary: #9c1621; /* 大明朱红 */
            --secondary: #d4af37; /* 鎏金 */
            --border: #c49863;
            --card-bg: #fffaf0;
            --shadow: rgba(120,70,30,0.15);
        }
        .dark{
            --bg: #0f0c0a;
            --text: #e9e2d5;
            --primary: #b81c29;
            --secondary: #e6c260;
            --border: #6b533c;
            --card-bg: #1a1512;
            --shadow: rgba(0,0,0,0.4);
        }
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            font-family: "Noto Serif SC", "SimSun", serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display:flex;
            flex-direction: column;
            transition: background 0.4s ease, color 0.4s ease;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 10 C80 30, 80 90,60 110 C40 90,40 30,60 10' fill='none' stroke='%23c49863' stroke-width='0.4' opacity='0.12'/%3E%3C/svg%3E");
        }
        header{
            padding:2rem 1rem;
            text-align:center;
            position:relative;
        }
        .theme-toggle{
            position:absolute;
            top:1rem;
            right:1rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            color:var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor:pointer;
            font-family:inherit;
            transition:0.3s;
        }
        .theme-toggle:hover{
            background:var(--primary);
            color:#fff;
        }
        .title-main{
            font-size: clamp(2rem,6vw,3.2rem);
            color:var(--primary);
            letter-spacing: 0.35em;
            margin-bottom:0.6rem;
        }
        .subtitle{
            font-size:1.1rem;
            opacity:0.8;
            letter-spacing:0.15em;
        }
        /* 中式分割纹样 */
        .divider{
            width: min(420px,90%);
            height:2px;
            margin:2rem auto;
            background:linear-gradient(90deg, transparent, var(--secondary), transparent);
            position:relative;
        }
        .divider::before,.divider::after{
            content:「」;
            position:absolute;
            top:-12px;
            color:var(--secondary);
            font-size:1.5rem;
        }
        .divider::before{left:0}
        .divider::after{right:0}

        main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem 1rem;
        }
        .card{
            border:1px solid var(--border);
            background:var(--card-bg);
            padding: 3rem 2rem;
            max-width:560px;
            width:100%;
            text-align:center;
            box-shadow: 0 8px 24px var(--shadow);
            border-radius:2px;
            /* 古风内边装饰 */
            background-image: linear-gradient(var(--card-bg),var(--card-bg)),
            url("data:image/svg+xml,%3Csvg width='30' height='30' viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='28' height='28' x='1' y='1' fill='none' stroke='%23c49863' stroke-width='0.3' opacity='0.15'/%3E%3C/svg%3E");
            background-origin: padding-box;
        }
        .seal{
            width:90px;
            height:90px;
            margin:0 auto 1.6rem;
            border:3px solid var(--primary);
            border-radius:6px;
            display:grid;
            place-items:center;
            color:var(--primary);
            font-size:1.8rem;
            font-weight:bold;
            transform:rotate(-8deg);
        }
        .tip-text{
            margin-bottom:2rem;
            line-height:1.8;
            font-size:1.05rem;
        }
        .goto-home{
            display:inline-block;
            padding: 0.9rem 2.6rem;
            background-color:var(--primary);
            color:#fff;
            text-decoration:none;
            font-size:1.1rem;
            letter-spacing:0.15em;
            border: 2px solid var(--primary);
            transition: 0.3s ease;
        }
        .goto-home:hover{
            background:transparent;
            color:var(--primary);
        }
        footer{
            padding:1.8rem 1rem;
            text-align:center;
            font-size:0.9rem;
            opacity:0.75;
            line-height:1.7;
            border-top:1px solid var(--border);
            margin-top:2rem;
        }
    </style>
</head>
<body>
    <header>
        <button class="theme-toggle" id="switchTheme">切换明暗</button>
        <h1 class="title-main">MingDynasty</h1>
        <p class="subtitle">大明 · 副站</p>
    </header>
    <div class="divider"></div>

    <main>
        <div class="card">
            <div class="seal">大明</div>
            <p class="tip-text">
                此为 MingDynasty 个人主页副站<br>
                前往主站阅览完整内容
            </p>
            <a class="goto-home" href="https://mingdynasty1.github.io">前往主站</a>
            <a class="goto-home" href="https://mingdynasty1.github.io/law/">关于Cookie的隐私政策</a>
        </div>
    </main>

    <footer>
        © 2013-2026 MingDynasty,Inc. 大明皇帝个人主页的副站 | 灵感来源于明朝美学
    </footer>

    <script>
        const btn = document.getElementById('switchTheme');
        btn.addEventListener('click',()=>{
            const html = document.documentElement;
            html.classList.toggle('dark');
            if(html.classList.contains('dark')){
                localStorage.setItem('theme','dark');
            }else{
                localStorage.setItem('theme','light');
            }
        })
    </script>
</body>
</html>
