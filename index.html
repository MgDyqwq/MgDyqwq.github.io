<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大明皇帝的备用网站 | MingDynasty</title>
    <!-- 网站头像 -->
    <link rel="icon" href="https://MingDynasty1.github.io/000000000000000000.png" type="image/png">
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
        }

        /* 明制亮色主题（默认）*/
        :root {
            --bg-color: #fdf6e3;
            --text-color: #3a2e22;
            --card-bg: #fff9e8;
            --border-color: #c49348;
            --title-color: #9e2b25;
            --btn-bg: #9e2b25;
            --btn-text: #fff;
            --shadow: 0 4px 12px rgba(196, 147, 72, 0.2);
        }

        /* 暗色主题 */
        [data-theme="dark"] {
            --bg-color: #1a1410;
            --text-color: #e6d5b8;
            --card-bg: #2d241b;
            --border-color: #a67c39;
            --title-color: #d4af37;
            --btn-bg: #d4af37;
            --btn-text: #1a1410;
            --shadow: 0 4px 12px rgba(166, 124, 57, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: all 0.3s ease;
            line-height: 1.8;
        }

        /* 页面容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .title {
            font-size: 2.2rem;
            color: var(--title-color);
            font-weight: bold;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .card h2 {
            color: var(--title-color);
            margin-bottom: 1rem;
            font-size: 1.5rem;
            border-left: 4px solid var(--border-color);
            padding-left: 10px;
        }

        .card p {
            font-size: 1.05rem;
            margin-bottom: 1rem;
            text-align: justify;
        }

        /* 跳转按钮 */
        .jump-btn {
            display: inline-block;
            background: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .jump-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            opacity: 0.8;
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            .card {
                padding: 1.5rem;
            }
            .theme-toggle {
                position: static;
                margin-bottom: 1rem;
            }
            .header {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1 class="title">大明皇帝网站 · 备用站</h1>
            <p class="subtitle">mgdyqwq.github.io</p>
            <button class="theme-toggle" id="themeBtn">切换暗色/亮色</button>
        </div>

        <!-- 主内容卡片 -->
        <div class="card">
            <h2>站点说明</h2>
            <p>因大明皇帝主站信息内容过多，整理与维护难度较大，后续所有<strong>新增内容、版本更新、资料补充</strong>将统一迁移至本备用站发布。</p>
            <p>主站将保留原有内容不再进行大规模更新，欢迎大家收藏本备用站获取最新资讯。</p>
            
            <a href="https://MingDynasty1.github.io" class="jump-btn" target="_blank">前往主站</a>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <p> © 2013-2026 MingDynasty,Inc.备用主站（开始研发）</p>
        </div>
    </div>

    <script>
        // 主题切换功能
        const themeBtn = document.getElementById('themeBtn');
        const html = document.documentElement;

        // 读取本地存储的主题
        const savedTheme = localStorage.getItem('ming-theme');
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
        }

        // 切换主题
        themeBtn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('ming-theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('ming-theme', 'dark');
            }
        });
    </script>
</body>
</html>
