<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明风书笺 · 大明共享写字板 | MingDynasty</title>
    <link rel="icon" href="https://MingDynasty1.github.io/000000000000000000.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-main: #f8f3e6;
            --bg-card: #fffaf0;
            --text-color: #2c2416;
            --border-color: #c9b89c;
            --btn-bg: #8c3130;
            --btn-text: #fff;
            --input-bg: #ffffff;
            --shadow: 0 2px 8px rgba(139, 117, 85, 0.25);
        }
        [data-theme="dark"] {
            --bg-main: #241f1a;
            --bg-card: #2d2721;
            --text-color: #e6dcc8;
            --border-color: #5c4f3e;
            --btn-bg: #a84241;
            --btn-text: #f8f3e6;
            --input-bg: #383028;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        body {
            font-family: "KaiTi", "STKaiti", SimSun, serif;
            background-color: var(--bg-main);
            color: var(--text-color);
            transition: all 0.3s ease;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 25px;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 4px;
            flex: 1;
        }
        #themeToggle {
            padding: 6px 14px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        .operate-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        #noteId {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            outline: none;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status {
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.8;
        }
        #editor {
            width: 100%;
            min-height: 70vh;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-color);
            font-family: "KaiTi", "STKaiti", SimSun, serif;
            font-size: 17px;
            line-height: 2;
            resize: none;
            outline: none;
        }
        .tip {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.7;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>明风书笺 · 共享写字板</h1>
            <button id="themeToggle">切换明暗</button>
        </div>

        <div class="operate-bar">
            <input type="text" id="noteId" placeholder="请输入笔记ID（仅字母数字）">
            <button id="openBtn">打开笔记</button>
            <button id="randomBtn">随机新建ID</button>
        </div>

        <div class="status" id="status">请输入ID或新建笔记</div>
        <textarea id="editor" placeholder="提笔书写，内容自动同步，多人可共同编辑..."></textarea>
        <div class="tip">© 2013-2026 MingDynasty,Inc. 大明便签 | 离线本地缓存 | 联网自动云端同步 | 支持无限多独立笔记</div>
    </div>

    <script>
        // ====================== 安全配置区分环境 ======================
        // 【重要】生产环境禁止直接写死密钥，建议改用后端接口中转
        const ENV_CONFIG = {
            // 开发环境临时使用，上线必须移除硬编码，改用后端代理
            dev: {
                supabaseUrl: "https://cnpsroesjlfkarulwfdh.supabase.co",
                supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNucHNyb2Vzamxma2FydWx3ZmRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDI5MjEsImV4cCI6MjA5NjkxODkyMX0.4pxDqp0Yz0PQwT9rkti3TLejMoMamgMiCDI7zvQbm4g"
            },
            prod: {
                // 生产环境置空，由后端接口动态下发，前端不存储密钥
                supabaseUrl: "",
                supabaseAnonKey: ""
            }
        };

        // 判断运行环境，线上环境禁用本地密钥
        const IS_PROD = window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1";
        const env = IS_PROD ? ENV_CONFIG.prod : ENV_CONFIG.dev;

        let sb = null;
        // 生产环境必须从后端获取密钥，否则禁止数据库操作
        async function initSupabaseClient() {
            if (IS_PROD) {
                try {
                    // 示例：请求后端接口获取密钥，后端做鉴权，密钥不暴露前端
                    const res = await fetch("/api/get-supabase-secret", {
                        method: "GET",
                        credentials: "same-origin"
                    });
                    const cfg = await res.json();
                    env.supabaseUrl = cfg.url;
                    env.supabaseAnonKey = cfg.anonKey;
                } catch (e) {
                    setStatus("安全初始化失败，仅本地模式可用");
                    return false;
                }
            }
            // 初始化客户端
            sb = supabase.createClient(env.supabaseUrl, env.supabaseAnonKey, {
                realtime: {
                    params: {
                        eventsPerSecond: 10 // 限制实时订阅频率，防刷库
                    }
                }
            });
            return true;
        }

        // DOM 元素
        const editor = document.getElementById('editor');
        const noteIdInput = document.getElementById('noteId');
        const openBtn = document.getElementById('openBtn');
        const randomBtn = document.getElementById('randomBtn');
        const statusEl = document.getElementById('status');
        const themeToggle = document.getElementById('themeToggle');

        let currentId = "";
        let syncTimer = null;
        let noteChannel = null;
        const LOCAL_PREFIX = "ming_note_";
        const SYNC_DELAY = 600; // 延长防抖，减少数据库请求
        const MAX_CONTENT_LENGTH = 50000; // 限制单篇笔记最大长度，防超大文本攻击

        // ====================== 安全工具函数 ======================
        // 1. ID 白名单校验：仅允许小写字母+数字，拦截特殊字符注入
        function validateNoteId(id) {
            return /^[a-z0-9]{8}$/.test(id);
        }

        // 2. XSS 内容过滤，转义危险标签
        function safeFilterContent(text) {
            if (!text) return "";
            // 过滤 script、iframe、onxxx 事件
            return text
                .replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "")
                .replace(/<iframe[\s\S]*?>[\s\S]*?<\/iframe>/gi, "")
                .replace(/on\w+="[^"]*"/gi, "")
                .slice(0, MAX_CONTENT_LENGTH);
        }

        // 3. 错误脱敏：隐藏数据库原始报错，避免泄露库结构
        function safeErrorMsg(rawErr) {
            if (!rawErr?.message) return "网络请求异常";
            const msg = rawErr.message.toLowerCase();
            // 区分业务错误和数据库底层错误
            if (msg.includes("auth") || msg.includes("key") || msg.includes("permission")) {
                return "数据库权限受限，仅本地保存内容";
            } else if (msg.includes("network") || msg.includes("fetch")) {
                return "网络连接失败，已缓存本地";
            } else if (msg.includes("rate limit")) {
                return "请求过于频繁，请稍后重试";
            }
            return "同步异常，内容已保存在本地";
        }

        // 4. 销毁实时频道兜底，防止非法监听
        function destroyRealtimeChannel() {
            if (noteChannel && sb) {
                sb.removeChannel(noteChannel);
                noteChannel = null;
            }
        }

        // 主题切换
        function initTheme() {
            try {
                const localTheme = localStorage.getItem("ming_theme");
                if(localTheme === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (e) {
                console.warn("本地存储被浏览器拦截，主题无法持久保存");
            }
        }
        themeToggle.addEventListener("click", () => {
            const isDark = document.documentElement.hasAttribute("data-theme");
            try {
                if(isDark) {
                    document.documentElement.removeAttribute("data-theme");
                    localStorage.setItem("ming_theme", "light");
                } else {
                    document.documentElement.setAttribute("data-theme", "dark");
                    localStorage.setItem("ming_theme", "dark");
                }
            } catch (e) {}
        });
        initTheme();

        function setStatus(text) {
            statusEl.innerText = text;
        }

        // 生成随机ID（固定8位纯小写字母数字，符合校验规则）
        function generateRandomId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let id = '';
            for (let i = 0; i < 8; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        // 本地缓存（捕获存储拦截异常）
        function saveLocal(id, content) {
            try {
                const safeText = safeFilterContent(content);
                localStorage.setItem(LOCAL_PREFIX + id, safeText);
            } catch (err) {
                console.warn("本地存储写入被拦截", err);
            }
        }
        function getLocal(id) {
            try {
                return localStorage.getItem(LOCAL_PREFIX + id) || '';
            } catch (err) {
                console.warn("本地存储读取被拦截", err);
                return '';
            }
        }

        // 加载笔记（增加ID校验、内容过滤、异常脱敏）
        async function loadNote(id) {
            if (!id) return;
            // ID 安全校验
            if (!validateNoteId(id)) {
                setStatus("ID格式错误，仅支持8位小写字母数字");
                return;
            }

            currentId = id;
            noteIdInput.value = id;
            setStatus("加载中...");
            openBtn.disabled = true;
            randomBtn.disabled = true;

            // 销毁旧频道
            destroyRealtimeChannel();

            // 未初始化客户端直接走本地模式
            if (!sb) {
                editor.value = getLocal(id);
                setStatus("云端未初始化，仅读取本地缓存");
                openBtn.disabled = false;
                randomBtn.disabled = false;
                return;
            }

            try {
                const { data, error } = await sb
                    .from('notes')
                    .select('content')
                    .eq('id', id);

                if (error) throw error;

                if (data.length === 0) {
                    // 新建笔记
                    await sb.from('notes').insert([{ 
                        id, 
                        content: "",
                        updated_at: new Date()
                    }]);
                    editor.value = "";
                    saveLocal(id, "");
                    setStatus(`新建笔记 ID：${id}`);
                } else {
                    const safeText = safeFilterContent(data[0].content);
                    editor.value = safeText;
                    saveLocal(id, safeText);
                    setStatus(`已打开笔记 ID：${id}`);
                }

                // 安全订阅实时更新
                noteChannel = sb
                    .channel(`note_${id}`, {
                        config: { broadcast: { self: false } } // 不接收自己的广播
                    })
                    .on(
                        'postgres_changes',
                        { 
                            event: 'UPDATE', 
                            schema: 'public', 
                            table: 'notes', 
                            filter: `id=eq.${id}` 
                        },
                        (payload) => {
                            const safeText = safeFilterContent(payload.new.content);
                            editor.value = safeText;
                            saveLocal(id, safeText);
                            setStatus("他人已更新内容");
                        }
                    )
                    .subscribe((status) => {
                        if (status === 'CHANNEL_ERROR') {
                            setStatus("实时同步通道异常");
                            destroyRealtimeChannel();
                        }
                    });
            } catch (err) {
                setStatus(safeErrorMsg(err));
                // 加载失败降级读取本地缓存
                editor.value = getLocal(id);
            }

            openBtn.disabled = false;
            randomBtn.disabled = false;
        }

        // 同步内容（内容过滤、限流、脱敏报错）
        async function syncContent() {
            if (!currentId || !sb) return;
            const rawContent = editor.value;
            const safeContent = safeFilterContent(rawContent);
            saveLocal(currentId, safeContent);
            setStatus("同步中...");

            try {
                const { error } = await sb
                    .from('notes')
                    .update({ 
                        content: safeContent, 
                        updated_at: new Date() 
                    })
                    .eq('id', currentId);

                if (error) throw error;
                setStatus("同步成功");
            } catch (err) {
                setStatus(safeErrorMsg(err));
            }
        }

        // 获取URL参数（过滤非法ID）
        function getUrlParam(name) {
            const params = new URLSearchParams(location.search);
            const val = params.get(name) || '';
            return validateNoteId(val) ? val : '';
        }

        // 页面加载初始化
        window.addEventListener('load', async () => {
            // 初始化Supabase客户端
            await initSupabaseClient();
            const urlId = getUrlParam('id');
            if (urlId) loadNote(urlId);
        });

        // 按钮事件
        openBtn.addEventListener('click', () => {
            const id = noteIdInput.value.trim().toLowerCase();
            loadNote(id);
        });
        randomBtn.addEventListener('click', () => {
            const newId = generateRandomId();
            history.replaceState({}, "", `?id=${newId}`);
            loadNote(newId);
        });

        // 输入防抖同步
        editor.addEventListener('input', () => {
            if (!currentId) return;
            clearTimeout(syncTimer);
            syncTimer = setTimeout(syncContent, SYNC_DELAY);
        });

        // 页面卸载销毁频道
        window.addEventListener('beforeunload', () => {
            destroyRealtimeChannel();
        });

        // 页面隐藏时断开实时连接，减少API消耗
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) destroyRealtimeChannel();
        });
    </script>
</body>
</html>
