<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大明车风过山车 | MingDynasty</title>
    <link rel="icon" href="https://MingDynasty1.github.io/000000000000000000.png" type="image/png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.7/index.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7; /* 宣纸色 */
            --text-color: #2c2c2c; /* 墨色 */
            --primary-red: #8b0000; /* 宫墙红 */
            --accent-gold: #d4af37; /* 琉璃金 */
            --panel-bg: rgba(255, 255, 255, 0.9);
            --border-style: 2px solid var(--primary-red);
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-red: #ff4d4d;
            --accent-gold: #ffd700;
            --panel-bg: rgba(30, 30, 30, 0.9);
            --border-style: 2px solid var(--accent-gold);
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.5s, color 0.5s;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas where needed */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            border-bottom: 3px double var(--primary-red);
            display: inline-block;
            padding-bottom: 10px;
            background: linear-gradient(to right, transparent, rgba(139, 0, 0, 0.1), transparent);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto;
            margin-top: 10px;
        }

        button {
            background: var(--panel-bg);
            border: var(--border-style);
            color: var(--text-color);
            padding: 10px 25px;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            background-color: var(--primary-red);
            color: white;
            border-color: var(--primary-red);
        }

        .map-selector {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .map-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            padding: 0;
        }

        .map-btn.active {
            background-color: var(--primary-red);
            color: white;
            border-color: var(--accent-gold);
            transform: scale(1.1);
        }

        .station-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 15px 40px;
            border: var(--border-style);
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            min-width: 300px;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-red);
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #ddd;
            margin-top: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-red);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Decorative Corner Elements */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid var(--primary-red);
            pointer-events: none;
            opacity: 0.6;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="header">
            <h1>大明御风行</h1>
            <div class="controls">
                <button id="toggle-theme">切换昼夜</button>
                <button id="toggle-ride">开始/暂停</button>
                <button id="reset-cam">重置视角</button>
            </div>
        </div>

        <div class="map-selector" id="map-list">
            <!-- Generated by JS -->
        </div>

        <div class="station-info">
            <div class="station-name" id="current-station">准备出发</div>
            <div style="font-size: 0.9rem; opacity: 0.8;">当前地图: <span id="current-map-name">京师繁华</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
    </div>

<script>
/**
 * Configuration & State
 */
const CONFIG = {
    maps: [
        { name: "京师繁华", color: 0x8b0000, ground: 0xeaddcf, type: 'city' }, // Red/Gold
        { name: "江南烟雨", color: 0x2f4f4f, ground: 0xc1e1c1, type: 'water' }, // Green/Grey
        { name: "边关冷月", color: 0x555555, ground: 0xdcdcdc, type: 'wall' },   // Grey/White
        { name: "大漠孤烟", color: 0xdaa520, ground: 0xf4a460, type: 'desert' }, // Gold/Brown
        { name: "蜀山云海", color: 0x4b0082, ground: 0xe6e6fa, type: 'mountain' }, // Purple/Mist
        { name: "东海蓬莱", color: 0x00008b, ground: 0xadd8e6, type: 'island' }  // Blue/Cyan
    ],
    stationsPerMap: 9,
    trackPoints: 200, // Resolution of curve
    speed: 0.0005
};

let state = {
    currentMapIndex: 0,
    isRiding: false,
    progress: 0, // 0 to 1
    theme: 'light',
    cameraMode: 'follow' // 'follow' or 'free'
};

// Three.js Globals
let scene, camera, renderer;
let trackCurve, trackMesh, tubeMesh;
let cartGroup;
let mapObjects = []; // Store objects to clear on switch
let animationId;

// DOM Elements
const uiStation = document.getElementById('current-station');
const uiMapName = document.getElementById('current-map-name');
const uiProgress = document.getElementById('progress');
const uiMapList = document.getElementById('map-list');

/**
 * Initialization
 */
function init() {
    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfdfbf7);
    scene.fog = new THREE.Fog(0xfdfbf7, 20, 150);

    // Camera
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 20);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lighting
    setupLights();

    // Initial Map
    generateMapButtons();
    loadMap(0);

    // Event Listeners
    window.addEventListener('resize', onWindowResize, false);
    document.getElementById('toggle-theme').addEventListener('click', toggleTheme);
    document.getElementById('toggle-ride').addEventListener('click', () => {
        state.isRiding = !state.isRiding;
    });
    document.getElementById('reset-cam').addEventListener('click', resetCamera);

    // Animation Loop
    animate();
}

function setupLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 500;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);
    
    // Store for theme switching
    scene.userData.dirLight = dirLight;
    scene.userData.ambientLight = ambientLight;
}

/**
 * Map Generation Logic
 */
function generateMapButtons() {
    uiMapList.innerHTML = '';
    CONFIG.maps.forEach((m, index) => {
        const btn = document.createElement('button');
        btn.className = `map-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = index + 1;
        btn.title = m.name;
        btn.onclick = () => switchMap(index);
        uiMapList.appendChild(btn);
    });
}

function switchMap(index) {
    if (index === state.currentMapIndex) return;
    
    // Update UI
    document.querySelectorAll('.map-btn').forEach((b, i) => {
        b.classList.toggle('active', i === index);
    });
    
    state.currentMapIndex = index;
    state.progress = 0;
    state.isRiding = false;
    
    // Transition effect could go here
    loadMap(index);
}

function clearMap() {
    // Remove old track and scenery
    if(trackMesh) scene.remove(trackMesh);
    if(tubeMesh) scene.remove(tubeMesh);
    if(cartGroup) scene.remove(cartGroup);
    
    mapObjects.forEach(obj => scene.remove(obj));
    mapObjects = [];
}

function loadMap(index) {
    clearMap();
    
    const mapConfig = CONFIG.maps[index];
    uiMapName.innerText = mapConfig.name;
    
    // 1. Generate Track Curve
    // Create a complex closed loop with hills
    const points = [];
    const radius = 40;
    const segments = 20;
    
    for (let i = 0; i <= segments; i++) {
        const t = (i / segments) * Math.PI * 2;
        // Base circle
        let x = Math.cos(t) * radius;
        let z = Math.sin(t) * radius;
        
        // Add noise/hills
        let y = Math.sin(t * 3) * 10 + Math.cos(t * 5) * 5;
        if (y < 2) y = 2; // Keep above ground
        
        // Variation based on map type
        if(mapConfig.type === 'mountain') y *= 2;
        if(mapConfig.type === 'city') y = Math.max(5, y); // Higher minimum
        
        points.push(new THREE.Vector3(x, y, z));
    }
    
    // Close the loop smoothly
    trackCurve = new THREE.CatmullRomCurve3(points, true);
    
    // Visual Track
    const tubeGeo = new THREE.TubeGeometry(trackCurve, 100, 0.4, 8, true);
    const tubeMat = new THREE.MeshStandardMaterial({ 
        color: mapConfig.color, 
        roughness: 0.4,
        metalness: 0.6
    });
    tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
    tubeMesh.castShadow = true;
    tubeMesh.receiveShadow = true;
    scene.add(tubeMesh);
    
    // Support Pillars (Simple cylinders down to ground)
    for(let i=0; i<points.length; i+=2) {
        const p = points[i];
        const pillarHeight = p.y;
        const pillarGeo = new THREE.CylinderGeometry(0.2, 0.3, pillarHeight, 6);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 }); // Wood color
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(p.x, pillarHeight/2, p.z);
        pillar.castShadow = true;
        scene.add(pillar);
        mapObjects.push(pillar);
    }

    // Ground Plane
    const planeGeo = new THREE.PlaneGeometry(200, 200);
    const planeMat = new THREE.MeshStandardMaterial({ 
        color: mapConfig.ground,
        side: THREE.DoubleSide
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    scene.add(plane);
    mapObjects.push(plane);

    // Scenery Generation (Procedural Ming Style Assets)
    generateScenery(mapConfig);

    // Cart
    createCart();
}

function generateScenery(config) {
    const count = 30;
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 10 + Math.random() * 60; // Avoid track center
        const x = Math.cos(angle) * dist;
        const z = Math.sin(angle) * dist;
        
        // Check distance from track to avoid collision (simple check)
        // In a real app, we'd project point onto curve. Here we just randomize safely.
        
        let mesh;
        const typeRand = Math.random();
        
        if (config.type === 'city' || config.type === 'wall') {
            // Pagoda / Building
            mesh = createPagoda(Math.floor(Math.random() * 3) + 2);
        } else if (config.type === 'water' || config.type === 'island') {
            // Trees or Rocks
            mesh = typeRand > 0.5 ? createTree() : createRock();
        } else {
            // Mountains/Desert rocks
            mesh = createRock();
            mesh.scale.setScalar(1 + Math.random() * 2);
        }
        
        mesh.position.set(x, 0, z);
        mesh.rotation.y = Math.random() * Math.PI;
        
        scene.add(mesh);
        mapObjects.push(mesh);
    }
}

// Helper: Create a simple Ming-style Pagoda
function createPagoda(floors) {
    const group = new THREE.Group();
    const redMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });

    let yPos = 0;
    for(let i=0; i<floors; i++) {
        const size = 3 - (i * 0.4);
        const height = 2.5;
        
        // Body
        const bodyGeo = new THREE.BoxGeometry(size, height, size);
        const body = new THREE.Mesh(bodyGeo, redMat);
        body.position.y = yPos + height/2;
        body.castShadow = true;
        group.add(body);
        
        // Roof (Curved look using cone + cylinder hack or just flattened cone)
        const roofRadius = size * 1.2;
        const roofGeo = new THREE.ConeGeometry(roofRadius, 1, 4);
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = yPos + height + 0.2;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        
        yPos += height + 0.5;
    }
    
    // Top Spire
    const spireGeo = new THREE.CylinderGeometry(0.1, 0.1, 2);
    const spire = new THREE.Mesh(spireGeo, goldMat);
    spire.position.y = yPos + 1;
    group.add(spire);
    
    return group;
}

function createTree() {
    const group = new THREE.Group();
    const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 3);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3c31 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    group.add(trunk);
    
    // Willow/Pine style foliage layers
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d4c1e });
    for(let i=0; i<3; i++) {
        const r = 2.5 - i*0.6;
        const geo = new THREE.ConeGeometry(r, 1.5, 8);
        const leaf = new THREE.Mesh(geo, leafMat);
        leaf.position.y = 3 + i*1.2;
        leaf.castShadow = true;
        group.add(leaf);
    }
    return group;
}

function createRock() {
    const geo = new THREE.DodecahedronGeometry(1 + Math.random());
    const mat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.5;
    mesh.scale.y = 0.7 + Math.random() * 0.5;
    mesh.castShadow = true;
    return mesh;
}

function createCart() {
    cartGroup = new THREE.Group();
    
    // Cart Body (Wooden carriage style)
    const bodyGeo = new THREE.BoxGeometry(1.5, 1, 2.5);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.8;
    cartGroup.add(body);
    
    // Roof (Arched)
    const roofGeo = new THREE.CylinderGeometry(1, 1, 2.6, 10, 1, false, 0, Math.PI);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.rotation.z = Math.PI / 2;
    roof.rotation.y = Math.PI / 2;
    roof.position.y = 1.3;
    cartGroup.add(roof);
    
    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 12);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    
    const positions = [
        [-0.8, 0.4, 0.8], [0.8, 0.4, 0.8],
        [-0.8, 0.4, -0.8], [0.8, 0.4, -0.8]
    ];
    
    positions.forEach(pos => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(...pos);
        cartGroup.add(w);
    });

    // Lanterns (Glowing)
    const lanternGeo = new THREE.SphereGeometry(0.2);
    const lanternMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    const l1 = new THREE.Mesh(lanternGeo, lanternMat);
    l1.position.set(0, 1.5, 1.3);
    const l2 = new THREE.Mesh(lanternGeo, lanternMat);
    l2.position.set(0, 1.5, -1.3);
    cartGroup.add(l1);
    cartGroup.add(l2);
    
    // Point light attached to cart
    const cartLight = new THREE.PointLight(0xffaa00, 1, 10);
    cartLight.position.set(0, 1, 0);
    cartGroup.add(cartLight);

    scene.add(cartGroup);
}

/**
 * Animation & Logic
 */
function updateCartPosition() {
    if (!trackCurve || !cartGroup) return;

    if (state.isRiding) {
        state.progress += CONFIG.speed;
        if (state.progress >= 1) {
            state.progress = 0; // Loop
        }
    }

    // Get position on curve
    const pos = trackCurve.getPointAt(state.progress);
    const tangent = trackCurve.getTangentAt(state.progress);

    cartGroup.position.copy(pos);
    
    // Orient cart along track
    const axis = new THREE.Vector3(0, 1, 0);
    cartGroup.lookAt(pos.clone().add(tangent));
    
    // Bank the cart slightly on turns for realism
    // Calculate normal/binormal would be better, but simple up is okay for this demo
    
    // Camera Follow Logic
    if (state.cameraMode === 'follow') {
        // Position camera behind and above cart
        const offset = new THREE.Vector3(0, 3, -6); // Relative offset
        offset.applyMatrix4(cartGroup.matrixWorld);
        
        // Smoothly interpolate camera position
        camera.position.lerp(offset, 0.1);
        camera.lookAt(pos);
    }
    
    // Update UI
    updateUI();
}

function updateUI() {
    uiProgress.style.width = `${state.progress * 100}%`;
    
    // Determine Station Name
    // 9 Stations per map distributed evenly
    const stationIndex = Math.floor(state.progress * CONFIG.stationsPerMap);
    const stationNames = [
        "起点·正阳门", "二站·太和殿", "三站·御花园", 
        "四站·钦天监", "五站·文华殿", "六站·武英殿", 
        "七站·神武门", "八站·景山亭", "九站·钟鼓楼"
    ];
    
    // Rotate names slightly based on map to feel different? 
    // For simplicity, use same structure but maybe prefix
    const prefix = ["京", "江", "关", "漠", "蜀", "海"][state.currentMapIndex];
    uiStation.innerText = stationNames[stationIndex % stationNames.length].replace("·", `·${prefix}·`);
}

function toggleTheme() {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    
    if (state.theme === 'dark') {
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog.color.setHex(0x1a1a1a);
        scene.userData.ambientLight.intensity = 0.2;
        scene.userData.dirLight.intensity = 0.3;
    } else {
        scene.background = new THREE.Color(0xfdfbf7);
        scene.fog.color.setHex(0xfdfbf7);
        scene.userData.ambientLight.intensity = 0.6;
        scene.userData.dirLight.intensity = 0.8;
    }
}

function resetCamera() {
    state.cameraMode = 'follow';
    // Immediate snap or tween could happen here
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(time) {
    requestAnimationFrame(animate);
    TWEEN.update(time);
    updateCartPosition();
    renderer.render(scene, camera);
}

// Start
init();

</script>
</body>
</html>
